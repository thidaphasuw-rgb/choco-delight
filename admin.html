<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choco Delight | Order Admin</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:1100px;margin:50px auto;padding:20px}.admin table{width:100%;border-collapse:collapse;background:#fffaf2}.admin th,.admin td{padding:12px;text-align:left;border-bottom:1px solid #ddd;vertical-align:top}.admin th{background:#e8d6c3}.admin input{padding:12px;border:1px solid #ddd;border-radius:8px}.admin button{cursor:pointer}.order-items{font-size:13px;color:#6e5a49}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.status-select{padding:8px;border-radius:8px}.label-card{border:1px solid #333;padding:20px;margin:15px 0;max-width:380px;background:white;color:#111}.label-card .big{font-size:22px;font-weight:bold}@media print{.topbar,.toolbar,.hide-print{display:none!important}.admin{margin:0;padding:0}.label-card{break-inside:avoid}}</style></head><body><header class="topbar"><a class="brand" href="index.html">CHOCO <span>DELIGHT</span></a><nav><a href="index.html">หน้าร้าน</a></nav></header><main class="admin"><p class="eyebrow">ORDER MANAGEMENT</p><h1>จัดการออเดอร์ / Picking & Packing</h1><div class="toolbar hide-print"><input id="gas" placeholder="Apps Script Web App URL" style="min-width:300px"><input id="key" placeholder="Admin key"><button class="button dark" id="load">โหลดออเดอร์</button><button class="button" onclick="window.print()">พิมพ์รายการ / ใบจ่าหน้า</button></div><div id="status"></div><div id="orders"></div><div id="labels"></div></main><script>
const $=s=>document.querySelector(s);let orders=[],details=[];$('#load').onclick=load;async function load(){const u=$('#gas').value.trim(),k=$('#key').value.trim();if(!u||!k){$('#status').textContent='กรุณาใส่ URL และ Admin key';return;}$('#status').textContent='กำลังโหลด';try{const [a,b]=await Promise.all([fetch(u+'?action=orders&key='+encodeURIComponent(k)).then(r=>r.json()),fetch(u+'?action=orderitems&key='+encodeURIComponent(k)).then(r=>r.json())]);if(a.message==='Unauthorized'||b.message==='Unauthorized')throw Error('Admin key ไม่ถูกต้อง');orders=a.orders||[];details=b.items||[];render();$('#status').textContent='โหลดข้อมูลแล้ว';}catch(e){$('#status').textContent='โหลดไม่สำเร็จ: '+e.message;}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function fmt(n){return '฿'+Number(n||0).toLocaleString('th-TH');}
function render(){const rows=orders.map(o=>{const items=details.filter(x=>x.Order_ID===o.Order_ID);const list=items.map(i=>`${esc(i.Product_Name)} (${esc(i.SKU)}) × ${i.Quantity}`).join('<br>');return `<tr><td><b>${esc(o.Order_ID)}</b><br>${new Date(o.Created_At).toLocaleString('th-TH')}</td><td>${esc(o.Customer_Name)}<br>${esc(o.Phone)}<br>${esc(o.Address)} ${esc(o.Postcode)}<br>${esc(o.Note)}</td><td class="order-items">${list}</td><td>${fmt(o.Total)}</td><td><select class="status-select" onchange="update('${esc(o.Order_ID)}',this.value)">${['Pending','Picking','Packed','Shipped','Cancelled'].map(s=>`<option ${s===o.Status?'selected':''}>${s}</option>`).join('')}</select></td><td><button onclick="label('${esc(o.Order_ID)}')">ใบจ่าหน้า</button></td></tr>`}).join('');$('#orders').innerHTML=orders.length?`<table><thead><tr><th>Order</th><th>ผู้รับ</th><th>รายการหยิบ</th><th>ยอด</th><th>สถานะ</th><th>เอกสาร</th></tr></thead><tbody>${rows}</tbody></table>`:'<p>ไม่มีคำสั่งซื้อ</p>';}
async function update(id,status){const u=$('#gas').value,k=$('#key').value;try{let r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'updateStatus',orderId:id,status,key:k})});let d=await r.json();if(!d.success)throw Error(d.message||'error');$('#status').textContent='ปรับสถานะแล้ว';}catch(e){$('#status').textContent='ปรับสถานะไม่สำเร็จ: '+e.message;}}
function label(id){const o=orders.find(x=>x.Order_ID===id);if(!o)return;$('#labels').innerHTML=`<div class="label-card"><small>CHOCO DELIGHT · SHIPPING LABEL</small><hr><div class="big">${esc(o.Customer_Name)}</div><p>${esc(o.Phone)}</p><p>${esc(o.Address)}</p><p>รหัสไปรษณีย์: ${esc(o.Postcode)}</p><p>Order: ${esc(o.Order_ID)}</p></div>`;window.scrollTo(0,$('#labels').offsetTop);}
</script></body></html>
